<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Review | Beauty Beez Studio</title>

    <link rel="stylesheet" href="Add review.css">

</head>

<body>

<header>

    <div class="header-container">

        <div class="logo">
            Reviews
        </div>

        <nav class="navbar">

            <ul>

                <li><a href="../Homepage/Homepage.html">HOME</a></li>

                <li>
    <a href="../Services-Pricing/Services-Pricing.html">
        SERVICES &amp; PRICING
    </a>
</li>

                <li><a href="../Gallery page/Gallery.html">
                    GALLERY
                </a></li>

                <li><a href="../About me page/About me.html">
                    ABOUT
                </a></li>

                <li><a href="../Reviews page/Reviews.html">
                    REVIEWS
                </a></li>

                <li><a href="../Contact us page/Contact us.html">
                    CONTACT
                </a></li>

                <li><a href="../FAQ's page/FAQ'S.html">
                    FAQ's
                </a></li>

            </ul>

        </nav>

    </div>

</header>

<section class="review-section">

    <h1 class="review-title">
        Add a review
    </h1>

    <form id="reviewForm" class="review-form">

        <div class="name-row">

            <input
                id="firstName"
                type="text"
                placeholder="First name"
                required
            >

            <input
                id="lastName"
                type="text"
                placeholder="Last name"
                required
            >

        </div>

        <div class="rating-box">

            <div class="rating">

                <input type="radio" id="star5" name="rating" value="5" required>
                <label for="star5">★</label>

                <input type="radio" id="star4" name="rating" value="4">
                <label for="star4">★</label>

                <input type="radio" id="star3" name="rating" value="3">
                <label for="star3">★</label>

                <input type="radio" id="star2" name="rating" value="2">
                <label for="star2">★</label>

                <input type="radio" id="star1" name="rating" value="1">
                <label for="star1">★</label>

            </div>

        </div>

        <input
            id="email"
            type="email"
            placeholder="Email"
            required
        >

        <textarea
            id="review"
            placeholder="Write a review"
            required
        ></textarea>

        <button
            type="submit"
            class="submit-btn"
        >
            Submit
        </button>

    </form>

</section>

<script src="Add review.js"></script>

</body>
</html>
