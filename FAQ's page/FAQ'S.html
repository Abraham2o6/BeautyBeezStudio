    <link rel="stylesheet" href="FAQ'S.css">
</head>

<body>


    <header>

        <div class="header-container">

            <div class="logo">
                FAQ's
            </div>

            <nav class="navbar">

                <ul>

                    <li><a href="../Homepage/Homepage.html">HOME</a></li>

                    <li><a href="../Services & Pricing page/Services & Pricing.html">SERVICES & PRICING</a></li>

                    <li><a href="../Gallery page/Gallery.html">GALLERY</a></li>

                    <li><a href="../About me page/About me.html">ABOUT</a></li>

                    <li><a href="../Reviews page/Reviews.html">REVIEWS</a></li>

                    <li><a href="../Contact us page/Contact us.html">CONTACT</a></li>

                    <li><a href="../FAQ's page/FAQ'S.html">FAQ's</a></li>

                </ul>

            </nav>

        </div>

    </header>


    <section class="faq-section">

        <div class="faq-content">

            <h2>
                Frequently asked<br>
                questions
            </h2>

            <select
                class="faq-search"
                id="faq-select"
            >

                <option value="" selected disabled>
                    Select a question
                </option>


                <option value="booking">
                    Do I need to book an appointment, or do you accept walk-ins?
                </option>

                <option value="book">
                    How do I book an appointment?
                </option>

                <option value="cancel">
                    How much notice do I need to cancel or reschedule?
                </option>

                <option value="late">
                    What if I am late?
                </option>


                <option value="services">
                    What nail services do you offer?
                </option>

                <option value="designs">
                    Do you do nail art or custom designs?
                </option>

                <option value="own-design">
                    Can I bring my own nail design idea?
                </option>

                <!-- Pricing -->

                <option value="prices">
                    How much do nails cost?
                </option>

                <option value="extra">
                    Does nail art cost extra?
                </option>


                <option value="sterilised">
                    Are your tools sterilised?
                </option>

                <option value="products">
                    Do you use safe products for nails?
                </option>


                <option value="last">
                    How long do nails last?
                </option>

                <option value="aftercare">
                    What should I avoid after getting my nails done?
                </option>

                <option value="repair">
                    What if my nail breaks or lifts?
                </option>

                <!-- Policies -->

                <option value="deposit">
                    Do you require a deposit?
                </option>

                <option value="refund">
                    Do you offer refunds?
                </option>

                <option value="late-policy">
                    Are late arrivals allowed?
                </option>


                <option value="discounts">
                    Do you offer discounts or loyalty rewards?
                </option>

                <option value="group">
                    Do you do group bookings for events?
                </option>

            </select>


            <div class="faq-answer" id="faq-answer">Select a question above to view the answer.</div>

        </div>

    </section>

    <script src="FAQ's.js"></script>

</body>
</html>
