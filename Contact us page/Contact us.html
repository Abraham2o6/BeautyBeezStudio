<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Beauty Beez Studio</title>

    <link rel="stylesheet" href="Contact us.css">

</head>

<body>


    <header>

        <div class="header-container">

            <div class="logo">
                Contact us
            </div>

            <nav class="navbar">

                <ul>

                    <li><a href="../Homepage/Homepage.html">HOME</a></li>

                    <li><a href="../Services & Pricing page/Services & Pricing.html">SERVICES & PRICING</a></li>

                    <li><a href="../Gallery page/Gallery.html">GALLERY</a></li>

                    <li><a href="../About me page/About me.html">ABOUT</a></li>

                    <li><a href="../Reviews page/Reviews.html">REVIEWS</a></li>

                    <li><a href="../Contact us page/Contact us.html">CONTACT</a></li>

                    <li><a href="../FAQ's page/FAQ'S.html">FAQ's</a></li>

                </ul>

            </nav>

        </div>

    </header>


    <section class="contact-section">

        <div class="contact-container">

            <form id="contactForm">


                <div class="name-row">

                    <div class="contact-card">

                        <label for="firstName">First name</label>

                        <input
                            id="firstName"
                            type="text"
                            placeholder="First name"
                            required
                        >

                    </div>

                    <div class="contact-card">

                        <label for="lastName">Last name</label>

                        <input
                            id="lastName"
                            type="text"
                            placeholder="Last name"
                            required
                        >

                    </div>

                </div>


                <div class="contact-card">

                    <label for="phone">Phone</label>

                    <input
                        id="phone"
                        type="text"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="contact-card">

                    <label for="email">Email</label>

                    <input
                        id="email"
                        type="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="contact-card">

                    <label for="location">Location</label>

                    <input
                        id="location"
                        type="text"
                        placeholder="Enter your location"
                        required
                    >

                </div>


                <div class="contact-card">

                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        placeholder="Write your message"
                        rows="10"
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="send-btn"
                >
                    Send
                </button>

            </form>

        </div>

    </section>

    <script src="Contact us.js"></script>

</body>

</html>
